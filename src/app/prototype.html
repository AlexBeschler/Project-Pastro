        <div class="container-fluid add-recipe-container mt-4">
            <div class="row justify-content-between">
                <!-- Top animation for mobile -->
                <transition @enter="enterAddRecipeLottieAnimation" @leave="leaveAddRecipeLottieAnimation" mode="out-in">
                    <div class="d-xl-none d-flex align-items-center justify-content-center" v-if="showStep1">
                        <lottie-player v-if="showStep1" key="first" src="assets/animation/add-recipe-1.json"
                            class="lottie-add-recipe-animation mobile-lottie-bar" background="transparent" speed="1.5"
                            autoplay></lottie-player>
                        <!--lottie-player v-if="showStep2" key="second" src="assets/animation/add-recipe-2.json"
                                class="lottie-add-recipe-animation mobile-lottie-bar" background="transparent" speed="1.0" autoplay></lottie-player>
                            <lottie-player v-if="showStep3" key="third" src="assets/animation/add-recipe-3.json"
                                class="lottie-add-recipe-animation mobile-lottie-bar" background="transparent" speed="1.0" autoplay></lottie-player-->
                    </div>
                </transition>
                <!-- Left padding -->
                <div class="col-xl-1 d-none d-md-block"></div>
                <div class="col-xl-8 bottom-block">
                    <div class="row">
                        <transition @enter="enterAddRecipeContentAnimation" @leave="leaveAddRecipeContentAnimation"
                            v-bind:css="false" mode="out-in">
                            <div class="px-4" style="display: flex; flex-direction: column; align-items: flex-start;"
                                v-if="showStep1" key="first">
                                <h2 class="fw-bold display-2 add-recipe-title">Add a new recipe</h2>
                                <input type="text" class="form-control" placeholder="Recipe name">
                                <button role="button" class="btn btn-primary mt-4" style="align-self: flex-end;"
                                    @click="addRecipe_ToStepTwo">Next</button>
                            </div>
                            <div class="px-4" style="display: flex; flex-direction: column; align-items: flex-start;"
                                v-if="showStep2" key="second">
                                <h2 class="fw-bold display-2 add-recipe-title">Step 2</h2>
                                <input type="text" class="form-control" placeholder="Recipe name">
                                <div class="d-flex w-100 justify-content-between mt-4">
                                    <button role="button" class="btn btn-outline-primary"
                                        @click="addRecipe_ToStepOne">Back</button>
                                    <button role="button" class="btn btn-primary"
                                        @click="addRecipe_ToStepThree">Next</button>
                                </div>
                            </div>
                            <div class="px-4" style="display: flex; flex-direction: column; align-items: flex-start;"
                                v-if="showStep3" key="third">
                                <h2 class="fw-bold display-2 add-recipe-title">Step 3</h2>
                                <div class="d-flex w-100 justify-content-between mt-4">
                                    <button role="button" class="btn btn-outline-primary"
                                        @click="addRecipe_ToStepTwo">Back</button>
                                    <button role="button" class="btn btn-success"
                                        @click="clickedFinishAddRecipe">Finish</button>
                                </div>
                            </div>
                        </transition>
                    </div>
                </div>
                <div class="col-xl-3 d-none d-xl-flex desktop-lottie-bar">
                    <div class="color-background"></div>
                    <transition @enter="enterAddRecipeLottieAnimation" @leave="leaveAddRecipeLottieAnimation"
                        mode="out-in">
                        <lottie-player v-if="showStep1" key="first" src="assets/animation/add-recipe-1.json"
                            class="lottie-add-recipe-animation" background="transparent" speed="1.5" autoplay>
                        </lottie-player>
                        <lottie-player v-if="showStep2" key="second" src="assets/animation/add-recipe-2.json"
                            class="lottie-add-recipe-animation" background="transparent" speed="1.0" autoplay>
                        </lottie-player>
                        <lottie-player v-if="showStep3" key="third" src="assets/animation/add-recipe-3.json"
                            class="lottie-add-recipe-animation" background="transparent" speed="0.5" autoplay>
                        </lottie-player>
                    </transition>
                </div>
            </div>


            <!--div id="manageRecipeAccordion" class="accordion accordion-flush manage-accordion-flush mt-4"
                ref="manageOverviewAccordionButton">
                <div class="accordion-item manage-accordion-item accordion-border">

                        </button>
                    </h2>
                    <div id="flush-overview" class="accordion-collapse manage-recipe-section collapse show"

                        <div class="accordion-body pe-1">
                            <div class="mb-3">
                                <div class="form-floating">
                                    <input type="text" class="form-control manage-recipe-input"
                                        id="manage_form_name" v-model="manage_recipeName" placeholder="Recipe name"
                                        required ref="recipeNameRef">
                                    <label for="manage_form_name">Recipe name</label>
                                    <div class="invalid-feedback">
                                        Please enter a name
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="addRecipeViewEditor" class="form-label">Description</label>
                                <div id="addRecipeViewEditor" ref="addRecipeViewEditor"></div>
                                <div class="invalid-feedback">
                                    Please enter a description
                                </div>
                                <div class="mt-2 mb-4 collapse" ref="ocrDescriptionCollapse">
                                    <input id="ocrDescriptionFilePond" type="file" data-max-file-size="12MB"
                                        accept="image/jpeg, image/png" />
                                    <div id="ocrDescriptionCropWrapper" class="cropperImg"
                                        v-show="ocr_DescriptionEditMode"></div>
                                    <button class="btn btn-success" v-show="ocr_DescriptionEditMode"
                                        @click="handleDescriptionOCRCrop">Crop</button>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col">
                                    <div class="form-floating">
                                        <input type="text" class="form-control manage-recipe-input me-3"
                                            id="manage_form_tags" v-model="manage_recipeTagInput"
                                            v-on:keyup.enter="addTagAddRecipeView" placeholder="Tags" required>
                                        <label for="manage_form_tags">Tags</label>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-3">
                                <div class="col-lg-12">
                                    <div v-if="manage_recipeTagHolder.length">
                                        <draggable-list-group :lock-axis="'y'" :press-delay.number=175
                                            v-model="manage_recipeTagHolder">
                                            <addrecipeview-tag-draggable-item
                                                v-for="(tag, index) in manage_recipeTagHolder" :index="index"
                                                :key="index" :tag="tag" :value="tag.value" :progress="tag.progress"
                                                :is-deleted="tag.isDeleted" :icon-color="iconColor"
                                                v-on:delete-tag="deleteTagAddRecipeView(index, tag)"
                                                v-on:undo-delete-tag="undoTagAddRecipeView(index)"
                                                @touchstart.native="scrollStop" @touchend.native="scrollMove" />
                                        </draggable-list-group>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="accordion-item manage-accordion-item accordion-border">
                    <h2 class="accordion-header">
                        <button class="accordion-button manage-accordion-button collapsed pe-1" type="button"
                            data-bs-toggle="collapse" data-bs-target="#flush-cover-photo">
                            <span>2</span><span style="margin-left: 1rem;">Cover Photo & Notes</span>
                        </button>
                    </h2>
                    <div id="flush-cover-photo" class="accordion-collapse manage-recipe-section collapse"
                        data-bs-parent="#manageRecipeAccordion" ref="manageCoverPhotoAccordionButton">
                        <div class="accordion-body pe-1">
                            <input id="coverPhotoURLInput" type="file" type="file" data-max-file-size="12MB"
                                accept="image/jpeg, image/png" />
                            <div class="row mt-3">
                                <div class="col">
                                    <div class="form-floating">
                                        <input id="manage_form_special_equipment" class="form-control mt-2"
                                            type="text" placeholder="Add special equipment"
                                            v-model="manage_specialEquipmentInput"
                                            v-on:keyup.enter="addSpecialEquipmentAddRecipeView">
                                        <label for="manage_form_special_equipment">Special Equipment</label>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-3">
                                <div class="col-lg-12">
                                    <div v-if="manage_specialEquipmentHolder.length">
                                        <draggable-list-group :lock-axis="'y'" :press-delay.number=175
                                            v-model="manage_specialEquipmentHolder">
                                            <recipeview-special-equipment-item
                                                v-for="(equipment, index) in manage_specialEquipmentHolder"
                                                :index="index" :key="index" :equipment="equipment"
                                                :progress="equipment.progress" :value="equipment.value"
                                                @touchstart.native="scrollStop" @touchend.native="scrollMove"
                                                v-on:delete-equipment="deleteSpecialEquipmentAddRecipeView(index, equipment)"
                                                v-on:undo-delete-equipment="undoDeleteSpecialEquipmentAddRecipeView(index)" />
                                        </draggable-list-group>
                                    </div>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col">
                                    <div class="form-floating">
                                        <input id="manage_form_notes" class="form-control mt-2" type="text"
                                            placeholder="Add recipe notes" v-model="manage_recipeNotesInput"
                                            v-on:keyup.enter="addNotesAddRecipeView">
                                        <label for="manage_form_notes">Recipe Notes</label>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-3">
                                <div class="col-lg-12">
                                    <div v-if="manage_recipeNotesHolder.length">
                                        <draggable-list-group :lock-axis="'y'" :press-delay.number=175
                                            v-model="manage_recipeNotesHolder">
                                            <recipe-notes-draggable-item
                                                v-for="(note, index) in manage_recipeNotesHolder" :index="index"
                                                :key="index" :note="note" :value="note.value"
                                                :progress="note.progress" @touchstart.native="scrollStop"
                                                @touchend.native="scrollMove"
                                                v-on:delete-note="deleteNotesAddRecipeView(index, note)"
                                                v-on:undo-delete-note="undoDeleteNotesAddRecipeView(index)" />
                                        </draggable-list-group>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="accordion-item manage-accordion-item accordion-border">
                    <h2 class="accordion-header">
                        <button class="accordion-button manage-accordion-button collapsed pe-1" type="button"
                            data-bs-toggle="collapse" data-bs-target="#flush-time-servings">
                            <span>3</span><span style="margin-left: 1rem;">Time & Servings</span>
                        </button>
                    </h2>
                    <div id="flush-time-servings" class="accordion-collapse manage-recipe-section collapse"
                        data-bs-parent="#manageRecipeAccordion" ref="manageTimeServingsAccordionButton">
                        <div class="accordion-body pe-1">
                            <div class="form-floating mb-2">
                                <input type="number" class="form-control manage-recipe-input"
                                    id="manage_form_prep_time" v-model="manage_recipePrepTime"
                                    placeholder="Prep Time (in minutes)" ref="recipePrepRef" required>
                                <div class="invalid-feedback">
                                    Please enter a preparation time
                                </div>
                                <label for="manage_form_prep_time">Prep Time (in minutes)</label>
                            </div>
                            <div class="form-floating mb-2">
                                <input type="number" class="form-control manage-recipe-input"
                                    id="manage_form_cook_time" v-model="manage_recipeCookTime"
                                    placeholder="Cook Time (in minutes)" ref="recipeCookRef" required>
                                <div class="invalid-feedback">
                                    Please enter a cook time
                                </div>
                                <label for="manage_form_cook_time">Cook Time (in minutes)</label>
                            </div>
                            <div class="form-floating mb-2">
                                <input type="number" class="form-control manage-recipe-input"
                                    id="manage_form_total_time" v-model="manage_recipeTotalTime"
                                    placeholder="Total Time (in minutes)" ref="recipeTotalRef" required>
                                <div class="invalid-feedback">
                                    Please enter a total time
                                </div>
                                <label for="manage_form_total_time">Total Time (in minutes)</label>
                            </div>
                            <div class="row mb-2">
                                <div class="col-10">
                                    <div class="form-floating">
                                        <input type="number" class="form-control manage-recipe-input me-3"
                                            id="manage_form_active_time" v-model="manage_recipeActiveTime"
                                            placeholder="Active Time (in minutes)" ref="recipeActiveRef" required>
                                        <div class="invalid-feedback">
                                            Please enter an active time
                                        </div>
                                        <label for="manage_form_active_time">Active Time (in
                                            minutes)</label>
                                    </div>
                                </div>
                                <div class="col-2 ps-0 d-flex align-items-end">
                                    <button class="btn h-100 w-100" type="button"
                                        @click.prevent="autofillActiveTime" style="padding: 0.375rem;">
                                        <reactive-svg :iconcolor="iconColor">
                                            <lightning></lightning>
                                        </reactive-svg>
                                    </button>
                                </div>
                            </div>
                            <div class="form-floating mb-4">
                                <input type="text" class="form-control manage-recipe-input" id="manage_form_yield"
                                    v-model="manage_recipeYield" placeholder="Yield, i.e. 2 servings"
                                    ref="recipeYieldRef" required>
                                <div class="invalid-feedback">
                                    Please enter a yield
                                </div>
                                <label for="manage_form_yield">Yield, i.e. 2 servings</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="accordion-item manage-accordion-item accordion-border">
                    <h2 class="accordion-header">
                        <button class="accordion-button manage-accordion-button pe-1 collapsed" type="button"
                            data-bs-toggle="collapse" data-bs-target="#flush-blocks">
                            <span>4</span><span style="margin-left: 1rem;">Ingredients & Steps</span>
                        </button>
                    </h2>
                    <div id="flush-blocks" class="accordion-collapse manage-recipe-section collapse"
                        data-bs-parent="#manageRecipeAccordion" ref="manageSectionsAccordionButton">
                        <div class="accordion-body py-1">
                            <div class="mb-0">
                                <ul class="nav nav-pills manage-recipe-blocks-pills-nav" role="tablist">
                                    <li class="nav-item" role="presentation">
                                        <button
                                            class="nav-link active position-relative manage-recipe-blocks-pills-tab me-2"
                                            data-bs-toggle="pill" data-bs-target="#pills-manage-ingredients"
                                            type="button" role="tab" ref="manageIngredientsTab">Ingredients
                                        </button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link position-relative manage-recipe-blocks-pills-tab"
                                            data-bs-toggle="pill" data-bs-target="#pills-manage-steps" type="button"
                                            role="tab" ref="manageStepsTab">Steps
                                        </button>
                                    </li>
                                </ul>
                                <div class="tab-content">
                                    <div class="fade collapse active show" id="pills-manage-ingredients"
                                        role="tabpanel" ref="manageIngredientsSectionButton">
                                        <div class="mb-3">
                                            <button class="btn btn-outline-primary w-100 my-4" type="button"
                                                data-bs-toggle="collapse"
                                                data-bs-target="#ocrIngredientsFilePondWrapper">
                                                <reactive-svg :iconcolor="iconColor">
                                                    <camera-fill></camera-fill>
                                                </reactive-svg>
                                            </button>
                                            <div id="ocrIngredientsFilePondWrapper" class="mb-4 collapse"
                                                ref="ocrIngredientsFilePondWrapperRef">
                                                <input id="ocrIngredientsFilePond" type="file"
                                                    data-max-file-size="12MB" accept="image/jpeg, image/png" />
                                                <div id="ocrIngredientsCropWrapper" class="cropperImg"
                                                    v-show="ocr_IngredientsEditMode"></div>
                                                <button class="btn btn-success" v-show="ocr_IngredientsEditMode"
                                                    @click="handleIngredientsOCRCrop">Crop</button>
                                            </div>
                                            <div v-if="manage_recipeSections.length <= 1">
                                                <div class="input-group my-3">
                                                    <input id="manage_ing_amount"
                                                        class="form-control manage-recipe-input me-3" type="text"
                                                        placeholder="Ingredient"
                                                        v-on:keyup.enter="addIngredientsAddRecipeView(-1)"
                                                        v-model="addIngredientModel[0]"
                                                        ref="ingredientInputAddRecipeView">
                                                </div>
                                                <div class="row">
                                                    <div class="col-12">
                                                        <div v-for="(section, index) in manage_recipeSections"
                                                            :index="index" :key="index">
                                                            <draggable-list-group :lock-axis="'y'"
                                                                :press-delay.number=175
                                                                v-model="section.ingredients">
                                                                <recipe-ingredients-draggable-item
                                                                    v-for="(ingredient, i) in section.ingredients"
                                                                    :index="i" :key="i" :ingredient="ingredient"
                                                                    :amount="ingredient.amount"
                                                                    :value="ingredient.value" :sectionindex="index"
                                                                    :progress="ingredient.progress"
                                                                    @touchstart.native="scrollStop"
                                                                    @touchend.native="scrollMove"
                                                                    v-on:delete-ingredient="deleteIngredientsAddRecipeView(index, i, ingredient)"
                                                                    v-on:undo-delete-ingredient="undoDeleteIngredientsAddRecipeView(index, i)" />
                                                            </draggable-list-group>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div v-else>
                                                <div v-for="(section, index) in manage_recipeSections"
                                                    :index="index" :key="index">
                                                    <input class="form-control manage-recipe-input mb-2" type="text"
                                                        placeholder="Section Title" v-model="section.title">
                                                    <div class="row mb-2">
                                                        <div class="col-1"></div>
                                                        <div class="col-11">
                                                            <input class="form-control manage-recipe-input"
                                                                type="text" placeholder="Add ingredient"
                                                                v-model="addIngredientModel[index]"
                                                                v-on:keyup.enter="addIngredientsAddRecipeView(index)"
                                                                ref="ingredientInputAddRecipeView">
                                                        </div>
                                                    </div>
                                                    <div class="row">
                                                        <div class="col-12">
                                                            <draggable-list-group :lock-axis="'y'"
                                                                :press-delay.number=175
                                                                v-model="section.ingredients">
                                                                <recipe-ingredients-draggable-item
                                                                    v-for="(ingredient, i) in section.ingredients"
                                                                    :index="i" :key="i" :ingredient="ingredient"
                                                                    :amount="ingredient.amount"
                                                                    :value="ingredient.value" :sectionindex="index"
                                                                    :progress="ingredient.progress"
                                                                    @touchstart.native="scrollStop"
                                                                    @touchend.native="scrollMove"
                                                                    v-on:delete-ingredient="deleteIngredientsAddRecipeView(index, i, ingredient)"
                                                                    v-on:undo-delete-ingredient="undoDeleteIngredientsAddRecipeView(index, i)" />
                                                            </draggable-list-group>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="tab-pane fade" id="pills-manage-steps" role="tabpanel"
                                        ref="manageStepsSectionButton">
                                        <div class="mb-3">
                                            <button class="btn btn-outline-primary w-100 my-4" type="button"
                                                data-bs-toggle="collapse" data-bs-target="#ocrStepsFilePondWrapper">
                                                <reactive-svg :iconcolor="iconColor">
                                                    <camera-fill></camera-fill>
                                                </reactive-svg>
                                            </button>
                                            <div id="ocrStepsFilePondWrapper" class="mb-4 collapse"
                                                ref="ocrStepsFilePondWrapperRef">
                                                <input id="ocrStepsFilePond" type="file" data-max-file-size="12MB"
                                                    accept="image/jpeg, image/png" />
                                                <div id="ocrStepsCropWrapper" class="cropperImg"
                                                    v-show="ocr_StepsEditMode"></div>
                                                <button class="btn btn-success" v-show="ocr_StepsEditMode"
                                                    @click="handleStepsOCRCrop">Crop</button>
                                            </div>
                                            <div v-if="manage_recipeSections.length <= 1">
                                                <div class="my-3">
                                                    <textarea id="manage_step_value" class="form-control mb-2"
                                                        placeholder="Add step" ref="manageStepRef"
                                                        v-model="addStepModel[0]"></textarea>
                                                    <div class="invalid-feedback">
                                                        Please add at least 1 step
                                                    </div>
                                                    <button class="btn text-primary button-no-outline"
                                                        @click="addStepsAddRecipeView(-1)">Add</button>
                                                </div>
                                                <div class="row">
                                                    <div class="col-12">
                                                        <div v-for="(section, index) in manage_recipeSections"
                                                            :index="index" :key="index">
                                                            <draggable-list-group :lock-axis="'y'"
                                                                :press-delay.number=175 v-model="section.steps">
                                                                <recipe-steps-draggable-item
                                                                    v-for="(step, i) in section.steps" :index="i"
                                                                    :key="i" :step="step" :value="step.value"
                                                                    :sectionindex="index" :progress="step.progress"
                                                                    v-on:delete-step="deleteStepsAddRecipeView(index, i, step)"
                                                                    v-on:undo-delete-step="undoDeleteStepsAddRecipeView(index, i)"
                                                                    @touchstart.native="scrollStop"
                                                                    @touchend.native="scrollMove" />
                                                            </draggable-list-group>
                                                        </div>
