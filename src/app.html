<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cookbook | Project Pastro</title>
    <!-- Custom font for fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
        integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <div id="login-container" style="visibility: hidden;">
        <sign-in-layout v-if="signin"></sign-in-layout>
        <purchase-subscription-layout v-if="paysubscription"></purchase-subscription-layout>
    </div>
    <div id="loading" class="loading-page">
        <div style="position: fixed;top: 50%;left: 50%;transform: translate(-50%, -50%);">
            <!-- Used for greeting -->
            <div class="row">
                <h1 id="loading-text" class="text-muted"></h1>
            </div>
            <div class="row">
                <h2 id="loading-subtext"></h2>
            </div>
        </div>
    </div>
    <div id="appContent" class="container my-4 main-wrap" style="visibility: hidden;">
        <div id="navigationBar">
            <header class="d-flex justify-content-center py-3">
                <ul class="nav nav-pills">
                    <li class="nav-item"><a href="#" class="nav-link active">Explore</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Search</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Settings</a></li>
                </ul>
            </header>
        </div>
        <div id="explorePane">
            <div v-for="(recipe, $index) in cookbook" :key="$index">
                <p>{{ $index }}: {{ recipe }}</p>
            </div>
            <!--infinite-loading @infinite="infiniteScroll"></infinite-loading-->
        </div>
    </div>
    <template id="sign-in-layout-template">
        <form class="login-form">
            <img class="mb-4" src="assets/logo/pastro.svg" alt="" width="72" height="57">
            <h2>Sign into Pastro</h2>

            <p>Sign in with your Google Account</p>
            <button id="sign-in-button" class="btn btn-success" role="button" v-on:click.stop="signIn()">Sign
                In</button>
            <p class="mt-5 mb-3 text-muted">© 2021</p>
        </form>
    </template>

    <template id="purchase-subscription-layout-template">
        <form class="signup-form">
            <h2>Hi Alex,</h2>
            <p class="lead text-muted">Sign up below to get started. Cancel anytime.</p>
            <div class="card-body text-center">
                <div class="signup-options-benefit-group mx-auto">
                    <svg xmlns="http://www.w3.org/2000/svg" width="21" height="22" viewBox="0 0 21 22" fill="none">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M4 12.3916L4.72 11.6756L8.3 15.2396L16.879 6.65265L17.581 7.36965L8.3 16.6526L4 12.3916Z"
                            fill="#1A8917">
                        </path>
                    </svg>
                    No ads
                    <br>
                    <svg xmlns="http://www.w3.org/2000/svg" width="21" height="22" viewBox="0 0 21 22" fill="none">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M4 12.3916L4.72 11.6756L8.3 15.2396L16.879 6.65265L17.581 7.36965L8.3 16.6526L4 12.3916Z"
                            fill="#1A8917">
                        </path>
                    </svg>
                    Store unlimited recipes
                    <br>
                    <svg xmlns="http://www.w3.org/2000/svg" width="21" height="22" viewBox="0 0 21 22" fill="none">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M4 12.3916L4.72 11.6756L8.3 15.2396L16.879 6.65265L17.581 7.36965L8.3 16.6526L4 12.3916Z"
                            fill="#1A8917">
                        </path>
                    </svg>
                    Payments fulfilled by Stripe
                    <br>
                </div>
                <button id="paySubscriptionButton" class="buy-subscription-button w-100 btn mt-4"
                    @click.prevent="paySubscription()">
                    $1<sup>.29</sup>
                    <small class="text-muted"> /mo</small>
                </button>
            </div>
            <h5 class="mt-5">Wrong account?</h5>
            <button role="button" class="btn btn-outline-success">Sign Out</button>
            <p class="mt-5 mb-3 text-muted">© 2021</p>
        </form>
    </template>
    <!-- Core Dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous">
    </script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
        integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <!-- Firebase -->
    <script src="/__/firebase/8.6.1/firebase-app.js"></script>
    <script src="/__/firebase/8.6.1/firebase-analytics.js"></script>
    <script src="/__/firebase/8.6.1/firebase-auth.js"></script>
    <script src="/__/firebase/8.6.1/firebase-firestore.js"></script>
    <script src="/__/firebase/8.6.1/firebase-storage.js"></script>
    <script src="/__/firebase/8.6.1/firebase-functions.js"></script>
    <script src="/__/firebase/init.js"></script>
    <!-- Stripe -->
    <script src="https://js.stripe.com/v3/"></script>
    <!-- 3rd Party Helpers -->
    <!--script src="https://unpkg.com/vue-infinite-loading@^2/dist/vue-infinite-loading.js"></script-->
    <!-- Custom -->
    <script src="js/project-pastro-utils.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
