<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cookbook | Project Pastro</title>
    <!-- Custom font for fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">
    <!-- 3rd Party style sheets -->
    <!-- Core app -->
    <link rel="stylesheet" href="css/app.css">
    <!-- PWA -->
    <link rel="manifest" href="../manifest.json" crossorigin="use-credentials">
</head>

<body>
    <div id="login-container" style="visibility: hidden;">
        <sign-in-layout v-if="signin"></sign-in-layout>
        <purchase-subscription-layout v-if="paysubscription"></purchase-subscription-layout>
    </div>
    <div id="loading" class="loading-page">
        <div style="position: fixed;top: 50%;left: 50%;transform: translate(-50%, -50%);">
            <!-- Used for greeting -->
            <div class="row">
                <h1 id="loading-text" class="text-muted"></h1>
            </div>
            <div class="row">
                <h2 id="loading-subtext"></h2>
            </div>
        </div>
    </div>
    <div id="appContent" class="container my-4 main-wrap" style="visibility: hidden;">
        <div id="navigationBar">
            <header class="d-flex justify-content-center py-3">
                <ul class="nav nav-pills" role="tablist">
                    <li class="nav-item">
                        <button id="pills-explore-tab" class="nav-link active" data-bs-toggle="pill" data-bs-target="#explorePane"
                            type="button" role="tab" aria-controls="explorePane" aria-selected="true">Explore</button>
                    </li>
                    <li class="nav-item">
                        <button id="pills-search-tab" class="nav-link" data-bs-toggle="pill" data-bs-target="#searchPane" type="button"
                            role="tab" aria-controls="searchPane" aria-selected="false">Search</button>
                    </li>
                    <li class="nav-item">
                        <button id="pills-options-tab" class="nav-link" data-bs-toggle="pill" data-bs-target="#optionsPane" type="button"
                            role="tab" aria-controls="optionsPane" aria-selected="false">Options</button>
                    </li>
                </ul>
            </header>
        </div>
        <div class="tab-content">
            <div id="explorePane" class="row tab-pane fade show active" role="tabpanel" aria-labelledby="pills-explore-tab">
                <div class="px-4 py-5 my-5">
                    <h1 class="display-5 fw-bold">I feel like making <a data-bs-toggle="modal"
                            data-bs-target="#tagsModal">{{ displayTags }}</a> food that <a data-bs-toggle="modal"
                            data-bs-target="#pickTimeModal">{{ displayTime }}</a> and contains <a data-bs-toggle="modal"
                            data-bs-target="#ingredientsModal">{{ displayIngredients }}</a>
                    </h1>
                </div>
                <div v-for="(recipe, $index) in cookbook" :key="$index">
                    <p>{{ $index }}: {{ recipe }}</p>
                </div>

                <!-- Tags modal -->
                <div class="modal fade" id="tagsModal" tabindex="-1" aria-labelledby="chooseTags" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="chooseTags">Choose tags</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <div v-for="(tag, $index) in tagsArray" :key="$index">
                                    <input class="form-check-input" type="checkbox" value="" v-model="checkedTagsArray"
                                        :value="tag">
                                    <label class="form-check-label">
                                        {{ tag }}
                                    </label>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-primary" data-bs-dismiss="modal"
                                    v-on:click="updateFilters">Done</button>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Pick time modal -->
                <div class="modal fade" id="pickTimeModal" tabindex="-1" aria-labelledby="chooseTime"
                    aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="chooseTime">Choose times</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <!-- Time pickers here -->
                                <h4>Total recipe time</h4>
                                <div class="form-floating mb-3">
                                    <input type="number" class="form-control" id="totalTimeInput" placeholder="10"
                                        v-model="totalRecipeTimeInput">
                                    <label for="totalTimeInput">Total recipe time (in minutes)</label>
                                </div>
                                <h4>Or pick a time to be finished by</h4>
                                <div class="form-floating mb-3">
                                    <input type="time" class="form-control" id="totalTimeInput" placeholder="10"
                                        v-model="finishByTimeInput">
                                    <label for="totalTimeInput">Finish by</label>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-primary" data-bs-dismiss="modal"
                                    v-on:click="updateFilters">Done</button>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Ingredients modal -->
                <div class="modal fade" id="ingredientsModal" tabindex="-1" aria-labelledby="chooseIngredients"
                    aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="chooseIngredients">Choose ingredients</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <div v-for="(ingredient, $index) in ingredientsArray" :key="$index">
                                    <input class="form-check-input" type="checkbox" value=""
                                        v-model="checkedIngredientsArray" :value="ingredient.text">
                                    <label class="form-check-label">
                                        {{ ingredient.text }}
                                    </label>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-primary" data-bs-dismiss="modal"
                                    v-on:click="updateFilters">Done</button>
                            </div>
                        </div>
                    </div>
                </div>
                <!--infinite-loading @infinite="infiniteScroll"></infinite-loading-->
            </div>
            <div id="searchPane" class="row tab-pane fade" role="tabpanel" aria-labelledby="pills-search-tab">
                <h1>Search</h1>
            </div>
            <div id="optionsPane" class="row tab-pane fade" role="tabpanel" aria-labelledby="pills-options-tab">
                <h1>Options</h1>
            </div>
        </div>
        <button class="btn fab" type="button" v-on:click="clickedAddRecipe">+</button>
    </div>
    <template id="sign-in-layout-template">
        <form class="login-form">
            <img class="mb-4" src="assets/logo/pastro.svg" alt="" width="72" height="57">
            <h2>Sign into Pastro</h2>

            <p>Sign in with your Google Account</p>
            <button id="sign-in-button" class="btn btn-success" role="button" v-on:click.stop="signIn()">Sign
                In</button>
            <p class="mt-5 mb-3 text-muted">© 2021</p>
        </form>
    </template>

    <template id="purchase-subscription-layout-template">
        <form class="signup-form">
            <h2>Hi ,</h2>
            <p class="lead text-muted">Sign up below to get started. Cancel anytime.</p>
            <div class="card-body text-center">
                <div class="signup-options-benefit-group mx-auto">
                    <svg xmlns="http://www.w3.org/2000/svg" width="21" height="22" viewBox="0 0 21 22" fill="none">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M4 12.3916L4.72 11.6756L8.3 15.2396L16.879 6.65265L17.581 7.36965L8.3 16.6526L4 12.3916Z"
                            fill="#1A8917">
                        </path>
                    </svg>
                    No ads
                    <br>
                    <svg xmlns="http://www.w3.org/2000/svg" width="21" height="22" viewBox="0 0 21 22" fill="none">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M4 12.3916L4.72 11.6756L8.3 15.2396L16.879 6.65265L17.581 7.36965L8.3 16.6526L4 12.3916Z"
                            fill="#1A8917">
                        </path>
                    </svg>
                    Store unlimited recipes
                    <br>
                    <svg xmlns="http://www.w3.org/2000/svg" width="21" height="22" viewBox="0 0 21 22" fill="none">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M4 12.3916L4.72 11.6756L8.3 15.2396L16.879 6.65265L17.581 7.36965L8.3 16.6526L4 12.3916Z"
                            fill="#1A8917">
                        </path>
                    </svg>
                    Payments fulfilled by Stripe
                    <br>
                </div>
                <button id="paySubscriptionButton" class="buy-subscription-button w-100 btn mt-4"
                    @click.prevent="paySubscription()">
                    $1<sup>.29</sup>
                    <small class="text-muted"> /mo</small>
                </button>
            </div>
            <h5 class="mt-5">Wrong account?</h5>
            <button role="button" class="btn btn-outline-success">Sign Out</button>
            <p class="mt-5 mb-3 text-muted">© 2021</p>
        </form>
    </template>
    <!-- PWA Dependency -->
    <script>
        window.addEventListener("load", () => {
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("registerServiceWorker.js");
            }
        });
    </script>
    <!-- Core Dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <!-- Firebase -->
    <script src="/__/firebase/8.6.1/firebase-app.js"></script>
    <script src="/__/firebase/8.6.1/firebase-analytics.js"></script>
    <script src="/__/firebase/8.6.1/firebase-auth.js"></script>
    <script src="/__/firebase/8.6.1/firebase-firestore.js"></script>
    <script src="/__/firebase/8.6.1/firebase-storage.js"></script>
    <script src="/__/firebase/8.6.1/firebase-functions.js"></script>
    <script src="/__/firebase/init.js"></script>
    <!-- Stripe -->
    <script src="https://js.stripe.com/v3/"></script>
    <!-- 3rd Party Helpers -->
    <!--script src="https://unpkg.com/vue-infinite-loading@^2/dist/vue-infinite-loading.js"></script-->
    <script src="https://cdn.jsdelivr.net/npm/underscore@1.13.1/underscore-umd-min.js"></script>
    <!-- Custom -->
    <script src="js/project-pastro-utils.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
